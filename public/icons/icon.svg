<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#181432"/>
      <stop offset="100%" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c6aff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(124, 106, 255, 0.3)" stroke-width="6"/>

  <!-- Chat Bubble Base -->
  <path d="M 120 160 C 120 120, 150 90, 200 90 L 320 90 C 370 90, 400 120, 400 160 L 400 280 C 400 320, 370 350, 320 350 L 220 350 L 150 410 L 165 350 L 160 350 C 130 350, 120 320, 120 280 Z" 
        fill="rgba(30, 27, 75, 0.75)" stroke="url(#pulseGrad)" stroke-width="12" filter="url(#glow)"/>

  <!-- ECG / Pulse Wave inside Bubble -->
  <path d="M 155 230 L 210 230 L 235 175 L 265 295 L 295 195 L 320 245 L 340 230 L 365 230" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
